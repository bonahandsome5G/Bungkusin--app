<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D2A21" />
    <meta name="description" content="Bungkus! — selamatkan makanan berlebih dari restoran di sekitarmu, 50–70% lebih murah." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
    <title>Bungkus! — Food Rescue</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Petunjuk bila file ini dibuka langsung (dobel-klik) tanpa dev server -->
    <script>
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="max-width:560px;margin:12vh auto;padding:0 20px;font-family:system-ui,sans-serif;color:#1c2620;line-height:1.6">' +
            '<h1 style="font-size:28px;margin:0 0 8px">Aplikasi belum berjalan</h1>' +
            '<p>File <b>index.html</b> ini adalah kode sumber dan perlu dijalankan lewat dev server. Buka terminal di folder <b>bungkus-app</b>, lalu jalankan:</p>' +
            '<pre style="background:#1d2a21;color:#edb52b;padding:14px 16px;border-radius:12px;overflow:auto">npm install\nnpm run dev</pre>' +
            '<p>Kemudian buka alamat yang muncul (biasanya <b>http://localhost:5173</b>).</p>' +
            '<p>Untuk langsung mencoba tanpa terminal, buka file <b>bungkus-standalone.html</b> di folder yang sama.</p></div>'
        }
      }, 1500)
    </script>
  </body>
</html>
